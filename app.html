<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCPL — League</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap');
:root{--paper:#F3EFE4;--card:#F7F4EA;--ink:#17251C;--pitch:#1E5B3C;--deep:#12402A;--gold:#D9A441;--red:#B02A2A;--rule:#B9B29C;--muted:#5d6b62}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:16px}
header{border-bottom:3px solid var(--gold);position:sticky;top:0;background:var(--deep);z-index:9}
.mast{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wordmark{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--deep);text-decoration:none;line-height:1.25} .wordmark img{height:28px;display:block;width:auto}
.menu-btn{background:none;border:1.5px solid var(--paper);padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px;flex-shrink:0;margin-left:auto}
.menu-btn span{display:block;width:18px;height:2px;background:var(--paper)}
.menu-panel{display:none;position:absolute;right:10px;top:100%;background:var(--paper);border:2px solid var(--ink);min-width:210px;z-index:60;box-shadow:0 6px 18px rgba(23,37,28,.18)}
.menu-panel.open{display:block}
.menu-panel a,.menu-panel button.mi{display:block;width:100%;text-align:left;padding:14px 16px;font-family:'Oswald';font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:none;background:none;border-bottom:1px solid #DCD6C4;cursor:pointer;min-height:0}
.menu-panel button.mi.sub{padding-left:34px;font-size:12px}
.menu-panel :last-child{border-bottom:none}
nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:100%}
nav button{white-space:nowrap;flex-shrink:0}
.who{margin-left:auto;font-size:12px;color:var(--muted);font-family:'Oswald';letter-spacing:.06em;text-transform:uppercase}
main{max-width:960px;margin:0 auto;padding:18px 14px 70px}
h2{font-family:'Oswald';font-weight:600;font-size:24px;text-transform:uppercase;margin:14px 0 4px}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.sec{font-family:'Oswald';font-weight:600;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--deep);border-bottom:2px solid var(--ink);display:inline-block;padding-bottom:2px;margin:18px 0 10px}
.pill{background:transparent;color:var(--ink);border:1.5px solid var(--deep);padding:6px 12px;font-family:'Oswald';font-weight:500;font-size:12px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;min-height:36px}
.pill.on{background:var(--deep);color:var(--paper)}
.btn{background:var(--deep);color:var(--paper);border:none;padding:11px 18px;font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:42px}
.btn:disabled{background:var(--rule);cursor:default}
.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--deep);padding:8px 13px;font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ghost.red{color:var(--red);border-color:var(--red)}
input,select,textarea{border:1px solid var(--rule);background:#fff;padding:9px 10px;font-size:16px;font-family:inherit;max-width:100%}
label{font-size:12px;color:var(--muted);font-family:'Oswald';letter-spacing:.08em;text-transform:uppercase;display:block;margin:10px 0 3px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1.5px solid var(--ink);font-size:14px}
th{font-family:'Oswald';font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--deep);color:var(--paper);padding:7px 8px;text-align:left}
td{padding:7px 8px;border-bottom:1px solid #dcd6c4;vertical-align:middle}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.up{background:#1E5B3C14;border-left:3px solid var(--pitch)}
.dn{background:#B02A2A12;border-left:3px solid var(--red)}
.chip{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:7px;vertical-align:middle;border:1px solid #17251C33}
.card{border:1.5px solid var(--ink);background:var(--card);padding:12px 13px;margin-bottom:10px}
.card .h{font-family:'Oswald';font-weight:600;font-size:13.5px;text-transform:uppercase;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #e4dfd0;font-size:14.5px;flex-wrap:wrap}
.mut{color:var(--muted);font-style:italic;font-size:14px}
.msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--paper);padding:10px 18px;font-family:'Oswald';font-size:13px;letter-spacing:.06em;z-index:99;max-width:92vw}
.fxbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:1.5px solid var(--ink);padding:12px;margin-bottom:6px;font-size:15px;cursor:pointer;min-height:46px;font-family:inherit;text-align:left}
.nh{font-family:'Oswald';font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--deep);margin:16px 0 4px;border-bottom:2px solid var(--ink);display:inline-block;padding-bottom:2px}
.res{font-family:'Oswald';font-weight:600}.res.w{color:var(--pitch)}.res.l{color:var(--red)}.res.d{color:#AD7614}
.num{width:58px;text-align:center;padding:9px 6px}
@media(max-width:640px){ main{padding:14px 10px 70px} td,th{padding:6px 6px} }
</style>
</head>

<script>
/* ═══ CONFIG — EDIT THESE TWO LINES (Supabase → Project Settings → API) ═══ */
const SUPABASE_URL = "https://kotylcrugdagntrmyatc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VR3rmARgM6oSrkcc8BRdRQ_w6hwqIaM";
/* ═══════════════════════════════════════════════════════════════════════ */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LINES = ["Men's doubles","Women's doubles","Mixed 1","Mixed 2"];
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = (t, attrs={}, kids=[]) => { const n=document.createElement(t);
  for (const [k,v] of Object.entries(attrs)) { if(k==='class') n.className=v; else if(k==='text') n.textContent=v; else if(k.startsWith('on')) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  kids.forEach(k=>n.appendChild(k)); return n; };
const sortable = tbl => { const ths = tbl.querySelectorAll('thead th');
  ths.forEach((th,i)=>{ th.style.cursor='pointer'; th.title='Tap to sort';
    th.addEventListener('click',()=>{ const tb = tbl.querySelector('tbody'); if(!tb) return;
      const dir = th.dataset.dir = th.dataset.dir==='asc' ? 'desc' : 'asc';
      ths.forEach(o=>{ if(o!==th) delete o.dataset.dir; });
      const key = tr => { const td = tr.children[i]; if(!td) return '';
        return ((td.dataset.sort!==undefined ? td.dataset.sort : td.textContent)||'').trim().toLowerCase(); };
      Array.from(tb.children).sort((a,b)=>{ const x=key(a), y=key(b);
        const nx=parseFloat(x), ny=parseFloat(y);
        const cmp = (!isNaN(nx) && !isNaN(ny) && x!=='' && y!=='') ? nx-ny : x.localeCompare(y);
        return dir==='asc' ? cmp : -cmp; }).forEach(r=>tb.appendChild(r)); }); }); };
const mkSearch = ph => { const inp = el('input',{type:'search',placeholder:ph||'Search\u2026',style:'display:block;margin:2px 0 8px;width:min(340px,100%)'});
  const bind = tb => inp.addEventListener('input',()=>{ const q = inp.value.trim().toLowerCase();
    Array.from(tb.children).forEach(tr=>{ tr.style.display = !q || (tr.dataset.search || tr.textContent.toLowerCase()).includes(q) ? '' : 'none'; }); });
  return { box: inp, bind }; };
let toastT; const toast = t => { clearTimeout(toastT); document.querySelectorAll('.msg').forEach(m=>m.remove());
  const m = el('div',{class:'msg',text:t}); document.body.appendChild(m); toastT=setTimeout(()=>m.remove(),5000); };

const state = { user:null, profile:null, clubs:[], fixtures:[], results:[], settings:{}, tab:'me', sel:null };
const clubById = id => state.clubs.find(c=>c.id===id) || {name:id,color:'#999'};
const chip = c => `<span class="chip" style="background:${c.color}"></span>`;

/* ── data loads ── */
async function loadPublic(){
  const [c,f,r,s] = await Promise.all([
    db.from('clubs').select('*').order('name'),
    db.from('fixtures').select('*').order('division').order('round').order('match'),
    db.from('results').select('*'),
    db.from('settings').select('*'),
  ]);
  state.clubs = c.data||[]; state.fixtures = f.data||[]; state.results = r.data||[];
  state.settings = Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));
}
async function loadProfile(){
  if(!state.user){ state.profile=null; return; }
  const { data } = await db.from('profiles').select('*').eq('id', state.user.id).single();
  state.profile = data;
}
function nightDate(night, day){
  const s = state.settings.season_start; if(!s) return '';
  const parts = s.split('-').map(Number); if(parts.length !== 3 || !parts[0]) return '';
  const dt = new Date(parts[0], parts[1]-1, parts[2] + (night-1)*7 + (day==='Thu'?2:0));
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const fixTime = f => (f.night===8 || f.round%2===1) ? '6:30 PM' : '~7:45 PM';
const resFor = fid => state.results.find(r=>r.fixture_id===fid);
const linesOf = r => [[r.l1h,r.l1a],[r.l2h,r.l2a],[r.l3h,r.l3a],[r.l4h,r.l4a]];

/* ── standings (confirmed results only) ── */
function standings(div){
  const clubs = state.clubs.filter(c=>c.division===div);
  if(clubs.length!==6) return null;
  const T = Object.fromEntries(clubs.map(c=>[c.id,{P:0,W:0,D:0,L:0,PF:0,PA:0,Pts:0}]));
  state.fixtures.filter(f=>f.division===div).forEach(f=>{
    const r = resFor(f.id); if(!r || r.status!=='confirmed') return;
    let hw=0,aw=0,hp=0,ap=0;
    linesOf(r).forEach(([a,b])=>{ if(a>b)hw++; else aw++; hp+=a; ap+=b; });
    const H=T[f.home_club], A=T[f.away_club]; if(!H||!A) return;
    H.P++;A.P++; H.PF+=hp;H.PA+=ap; A.PF+=ap;A.PA+=hp;
    if(hw>aw){H.W++;A.L++;H.Pts+=3;} else if(aw>hw){A.W++;H.L++;A.Pts+=3;} else {H.D++;A.D++;H.Pts++;A.Pts++;}
  });
  return clubs.map(c=>({club:c,...T[c.id],PD:T[c.id].PF-T[c.id].PA}))
    .sort((a,b)=>b.Pts-a.Pts||b.PD-a.PD||b.PF-a.PF||a.club.name.localeCompare(b.club.name));
}

function render(){

  if(!state.user){

function vSignIn(m){
  m.appendChild(el('h2',{text:'Sign in'}));
  m.appendChild(el('div',{class:'sub',text:'For players and captains. Enter your email and we send a sign-in link — no passwords. Tables, clubs, and the map are on the main site.'}));
  const recents = (() => { try { return JSON.parse(localStorage.getItem('scpl-signin-emails')||'[]'); } catch(e){ return []; } })();
  const prefill = (() => { const mm = location.hash.match(/email=([^,&]+)/); return mm ? decodeURIComponent(mm[1]) : ''; })();
  const remember = email => { try {
    const list = [email].concat(recents.filter(x => x !== email)).slice(0, 4);
    localStorage.setItem('scpl-signin-emails', JSON.stringify(list));
  } catch(e){} };
  const send = async email => {
    remember(email);
    const { error } = await db.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + '/' } });
    toast(error ? 'Error: '+error.message : 'Link sent to ' + email + ' — check that inbox.');
  };
  if (recents.length) {
    m.appendChild(el('label',{text:'One tap for a recent account'}));
    const row = el('div',{style:'display:flex;flex-direction:column;gap:8px;max-width:340px;margin-bottom:16px'});
    recents.forEach(email => row.appendChild(el('button',{class:'ghost',text:email,style:'text-transform:none;letter-spacing:.02em;font-size:14px;text-align:left',onclick:()=>send(email)})));
    m.appendChild(row);
    m.appendChild(el('label',{text:'Or another email'}));
  }
  const inp = el('input',{type:'email',name:'email',autocomplete:'email',inputmode:'email',placeholder:'you@example.com',style:'width:280px',value:prefill});
  m.appendChild(inp);
  m.appendChild(el('div',{style:'margin-top:10px'},[el('button',{class:'btn',text:'Send link',onclick:()=>{
    const email = inp.value.trim(); if(!email) return;
    send(email);
  }})]));
}

function vFixtures(m){
  m.appendChild(el('h2',{text:'Fixtures'}));
  const names = state.clubs.map(c=>c.name);
  const wrap = el('div',{style:'position:relative;max-width:340px'});
  const inp = el('input',{placeholder:'Type or pick your club',style:'width:100%',autocomplete:'off'});
  const panel = el('div',{style:'display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--card);border:1.5px solid var(--ink);border-top:none;max-height:290px;overflow-y:auto'});
  const out = el('div',{style:'margin-top:12px'});
  const show = q => { const hits = q? names.filter(n=>n.toLowerCase().includes(q.toLowerCase())) : names;
    panel.replaceChildren(...hits.map(n=>el('div',{text:n,style:'padding:11px 13px;font-family:Oswald;font-size:14px;text-transform:uppercase;cursor:pointer;border-bottom:1px solid #e4dfd0',
      onmousedown:e=>{e.preventDefault(); inp.value=n; panel.style.display='none'; draw(n);}})));
    panel.style.display = hits.length?'block':'none'; };
  const draw = name => {
    out.replaceChildren();
    const club = state.clubs.find(c=>c.name===name); if(!club||!club.division) return;
    const mine = state.fixtures.filter(f=>f.division===club.division&&(f.home_club===club.id||f.away_club===club.id));
    let seenN = {};
    mine.forEach(f=>{
      if(!seenN[f.night]){ seenN[f.night]=1;
        const nd = nightDate(f.night, f.day);
        out.appendChild(el('div',{class:'nh',text:'Night '+f.night+' · '+(f.day==='Tue'?'Tuesday':'Thursday')+(nd?', '+nd:'')+' · '+f.venue})); }
      const home = f.home_club===club.id, opp = clubById(home?f.away_club:f.home_club);
      const r = resFor(f.id); let resHTML='';
      if(r&&r.status==='confirmed'){ const hw=linesOf(r).filter(l=>l[0]>l[1]).length;
        const mw=home?hw:4-hw, tw=4-mw;
        resHTML = `<span class="res ${mw>tw?'w':mw<tw?'l':'d'}">${mw}–${tw}</span>`; }
      const row = el('div',{class:'row'});
      row.innerHTML = `<span style="flex:1;padding-left:12px">v ${opp.name}</span>${resHTML}`;
      out.appendChild(row);
    });
  };
  inp.addEventListener('focus',()=>show(inp.value));
  inp.addEventListener('input',()=>show(inp.value));
  inp.addEventListener('blur',()=>setTimeout(()=>panel.style.display='none',150));
  wrap.appendChild(inp); wrap.appendChild(panel);
  m.appendChild(wrap); m.appendChild(out);
  const mineClub = state.profile && state.clubs.find(c=>c.id===state.profile.club_id);
  if(mineClub){ inp.value = mineClub.name; draw(mineClub.name); }
}

async function vFixtureDetail(m, f){
  const p = state.profile;
  const myClub = p.club_id, home = f.home_club===myClub;
  m.appendChild(el('button',{class:'ghost',text:'‹ Back',onclick:()=>{state.sel=null; render();}}));
  m.appendChild(el('h2',{text:clubById(f.home_club).name+' v '+clubById(f.away_club).name}));
  const nd2 = nightDate(f.night, f.day);
  m.appendChild(el('div',{class:'sub',text:'Night '+f.night+' · '+(f.day==='Tue'?'Tuesday':'Thursday')+(nd2?', '+nd2:'')+' · '+fixTime(f)+' · '+f.venue}));

  m.appendChild(el('div',{class:'sec',text:'Lineup (sealed until both clubs submit)'}));
  const luBox = el('div'); m.appendChild(luBox);
  const { data: lus } = await db.from('lineups').select('*').eq('fixture_id', f.id);
  const mine = (lus||[]).find(l=>l.club_id===myClub);
  const theirs = (lus||[]).find(l=>l.club_id!==myClub);
  if(!mine){
    const { data: roster } = await db.from('profiles').select('name,email,gender').eq('club_id', myClub);
    const people = (roster||[]).map(x=>({ label: (x.name && x.name.trim()) || x.email, g: x.gender }))
      .sort((x,y)=>x.label.localeCompare(y.label));
    const SLOTS = [['M','M'],['W','W'],['M','W'],['M','W']];
    let drafts;
    if(people.length){
      drafts = LINES.map((ln,i)=>{ luBox.appendChild(el('label',{text:ln}));
        const row = el('div',{style:'display:flex;gap:8px;max-width:520px'});
        const sels = SLOTS[i].map(g=>{
          let opts = people.filter(x=>x.g===g);
          if(!opts.length) opts = people;
          const sel = el('select',{style:'flex:1'},[el('option',{value:'',text:'— pick player —'}),
            ...opts.map(x=>el('option',{value:x.label,text:x.label}))]);
          row.appendChild(sel); return sel;
        });
        const sync = () => sels.forEach((s,si)=>{ const other = sels[1-si];
          [...s.options].forEach(o=>{ o.disabled = o.value !== '' && o.value === other.value; }); });
        sels.forEach(s=>s.addEventListener('change', sync));
        luBox.appendChild(row); return sels; });
    } else {
      drafts = LINES.map((ln,i)=>{ luBox.appendChild(el('label',{text:ln}));
        const inp = el('input',{placeholder:'player, player',style:'width:100%'}); luBox.appendChild(inp); return [inp]; });
    }
    const lineVal = pair => pair.map(sl=>sl.value.trim()).filter(Boolean).join(' & ');
    luBox.appendChild(el('div',{style:'margin-top:10px'},[el('button',{class:'btn',text:'Submit lineup',onclick:async()=>{
      if(drafts.some(pair=>pair.some(sl=>!sl.value.trim()))) return toast('Every line needs both players.');
      for(let i=0;i<drafts.length;i++){ const v = drafts[i].map(sl=>sl.value.trim());
        if(v.length===2 && v[0]===v[1]) return toast(LINES[i]+': that\u2019s the same player in both spots.'); }
      const pairKey = pair => pair.map(sl=>sl.value.trim()).sort().join(' & ');
      if(drafts[2].length===2 && drafts[3].length===2 && pairKey(drafts[2])===pairKey(drafts[3]))
        return toast('Mixed 1 and Mixed 2 can\u2019t be the same pair.');
      const { error } = await db.from('lineups').insert({ fixture_id:f.id, club_id:myClub,
        l1:lineVal(drafts[0]),l2:lineVal(drafts[1]),l3:lineVal(drafts[2]),l4:lineVal(drafts[3]), submitted_by:p.id });
      if(error) return toast('Error: '+error.message);
      toast('Lineup sealed.'); render();
    }})]));
  } else {
    const card = el('div',{class:'card'}); card.innerHTML = `<div class="h">${clubById(myClub).name} — submitted</div>`+
      LINES.map((ln,i)=>`<div class="row"><span style="color:var(--muted)">${ln}</span><span style="margin-left:auto">${esc(mine['l'+(i+1)])}</span></div>`).join('');
    luBox.appendChild(card);
    if(theirs){ const c2 = el('div',{class:'card'}); c2.innerHTML = `<div class="h">${clubById(theirs.club_id).name} — revealed</div>`+
      LINES.map((ln,i)=>`<div class="row"><span style="color:var(--muted)">${ln}</span><span style="margin-left:auto">${esc(theirs['l'+(i+1)])}</span></div>`).join('');
      luBox.appendChild(c2);
    } else luBox.appendChild(el('p',{class:'mut',text:"Opponent hasn't submitted yet; both lineups stay hidden."}));
  }

  m.appendChild(el('div',{class:'sec',text:'Score (home enters, away confirms)'}));
  const scBox = el('div'); m.appendChild(scBox);
  const r = resFor(f.id);
  if(!r && home){
    const mkScore = () => el('select',{class:'num'},[el('option',{value:'',text:'–'}),
      ...Array.from({length:22},(_,n)=>el('option',{value:String(n),text:String(n)}))]);
    const colStyle = 'width:58px;font-family:Oswald;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--deep);text-align:center;line-height:1.2';
    const head = el('div',{class:'row'});
    head.appendChild(el('span',{text:'',style:'width:120px'}));
    head.appendChild(el('span',{text:clubById(f.home_club).name,style:colStyle}));
    head.appendChild(el('span',{text:'–',style:'visibility:hidden'}));
    head.appendChild(el('span',{text:clubById(f.away_club).name,style:colStyle}));
    scBox.appendChild(head);
    const drafts = LINES.map(ln=>{ const wrap=el('div',{class:'row'});
      const a=mkScore(), b=mkScore();
      wrap.appendChild(el('span',{text:ln,style:'width:120px;color:var(--muted)'}));
      wrap.appendChild(a); wrap.appendChild(el('span',{text:'–'})); wrap.appendChild(b);
      scBox.appendChild(wrap); return [a,b]; });
    scBox.appendChild(el('div',{style:'margin-top:10px'},[el('button',{class:'btn',text:'Submit score',onclick:async()=>{
      if(drafts.some(([a,b])=>a.value===''||b.value==='')) return toast('All four lines need scores.');
      const [l1,l2,l3,l4]=drafts;
      const { error } = await db.from('results').insert({ fixture_id:f.id, status:'pending', entered_by:p.id,
        l1h:+l1[0].value,l1a:+l1[1].value,l2h:+l2[0].value,l2a:+l2[1].value,
        l3h:+l3[0].value,l3a:+l3[1].value,l4h:+l4[0].value,l4a:+l4[1].value });
      if(error) return toast('Error: '+error.message);
      await loadPublic(); toast('Submitted. Away captain confirms.'); render();
    }})]));
  } else if(!r) scBox.appendChild(el('p',{class:'mut',text:'Waiting for the home captain to enter the score.'}));
  else {
    const hw = linesOf(r).filter(l=>l[0]>l[1]).length;
    const card = el('div',{class:'card'});
    card.innerHTML = `<div class="h">${clubById(f.home_club).name} ${hw}–${4-hw} ${clubById(f.away_club).name} · ${r.status}</div>`+
      LINES.map((ln,i)=>`<div class="row"><span style="color:var(--muted)">${ln}</span><span style="margin-left:auto">${linesOf(r)[i][0]}–${linesOf(r)[i][1]}</span></div>`).join('');
    scBox.appendChild(card);
    if(r.status==='pending' && !home){
      const bar = el('div',{style:'display:flex;gap:8px'});
      bar.appendChild(el('button',{class:'btn',text:'Confirm score',onclick:async()=>{
        const { error } = await db.from('results').update({status:'confirmed'}).eq('fixture_id',f.id);
        if(error) return toast('Error: '+error.message);
        await loadPublic(); toast('Confirmed.'); render(); }}));
      bar.appendChild(el('button',{class:'ghost red',text:'Dispute',onclick:async()=>{
        const { error } = await db.from('results').update({status:'disputed'}).eq('fixture_id',f.id);
        if(error) return toast('Error: '+error.message);
        await loadPublic(); toast('Flagged for the league.'); render(); }}));
      scBox.appendChild(bar);
    }
  }
}

  });
  tbl.appendChild(tb); grid.appendChild(tbl); m.appendChild(grid);
  db.from('sponsors').select('*').then(({data})=>{ (data||[]).forEach(sp=>{ const r=spRows[sp.club_id]; if(r){ r.sn.value=sp.name||''; r.sa.value=(sp.amount&&+sp.amount!==0)?sp.amount:''; } }); });
  if(!locked){
    m.appendChild(el('div',{style:'margin-top:10px'},[el('button',{class:'btn',text:'Generate season fixtures',onclick:generateSeason})]));
  } else {
    m.appendChild(el('div',{style:'margin-top:10px'},[el('button',{class:'ghost red',text:'Delete all fixtures (unlock)',onclick:async()=>{
      if(!confirm('Delete the entire schedule and all results?')) return;
      await db.from('fixtures').delete().gte('id',0); await loadPublic(); render(); }})]));
  }

  m.appendChild(el('div',{class:'sec',text:'Interest & claims'}));
  m.appendChild(el('div',{class:'sub',text:'Signups who have not created an account yet \u2014 your follow-up queue. Once someone signs in they disappear from here and appear in People below with their request attached.'}));
  const iWrap = el('div'); m.appendChild(iWrap);

  m.appendChild(el('div',{class:'sec',text:'Season dates'}));
  m.appendChild(el('div',{class:'sub',text:'Set the date of Night 1 (the first Tuesday). Every night dates itself from this.'}));
  const sd = el('input',{type:'date',style:'display:block;margin:2px 0 10px'}); sd.value = state.settings.season_start || '';
  sd.addEventListener('change', async()=>{
    const { error } = await db.from('settings').upsert({ key:'season_start', value: sd.value });
    if(error) return toast('Error: '+error.message);
    await loadPublic(); toast('Season dates set.'); render();
  });
  m.appendChild(sd);

  m.appendChild(el('div',{class:'sec',text:'People'}));
  m.appendChild(el('div',{class:'sub',text:'Everyone with an account, straight from Claim my spot. Assign a club and role here. Once they also fill in their name and gender on their profile page, they move down to Rostered players.'}));
  const pS = mkSearch('Search people\u2026'); m.appendChild(pS.box);
  const pw = el('div',{class:'tw'}); m.appendChild(pw);

  m.appendChild(el('div',{class:'sec',text:'Rostered players'}));
  m.appendChild(el('div',{class:'sub',text:'Club assigned and profile complete. These are your real rosters.'}));
  const rS = mkSearch('Search rostered players\u2026'); m.appendChild(rS.box);
  const rw = el('div',{class:'tw'}); m.appendChild(rw);

  const buildPeople = (host, rows, search, emptyText, wantsMap) => {
    const t2 = el('table'); t2.innerHTML='<thead><tr><th>Name</th><th>Email</th><th>G</th>'+(wantsMap?'<th>Wants</th>':'')+'<th>Club</th><th>Role</th><th>Paid</th></tr></thead>';
    const b2 = el('tbody');
    if(!rows.length){ host.appendChild(el('div',{class:'sub',text:emptyText})); }
    rows.forEach(u=>{
      const tr = el('tr');
      const setSearch = clubName => { tr.dataset.search = [u.name||'', u.email||'', u.gender||'', clubName||''].join(' ').toLowerCase(); };
      setSearch((clubById(u.club_id)||{}).name);
      tr.appendChild(el('td',{text:u.name||'\u2014'}));
      tr.appendChild(el('td',{text:u.email}));
      tr.appendChild(el('td',{text:u.gender}));
      if(wantsMap){
        const wr = wantsMap[(u.email||'').toLowerCase()];
        let wTxt = '\u2014';
        if(wr){ const wc = wr.club_id ? (clubById(wr.club_id).name) : (wr.new_club ? ('New: '+wr.new_club) : ''); 
          wTxt = [wc, wr.level, wr.players].filter(Boolean).join(' \u00b7 ') || '\u2014'; }
        const wTd = el('td',{text:wTxt,style:'max-width:220px'}); wTd.dataset.sort = wTxt==='\u2014' ? '' : wTxt;
        tr.appendChild(wTd);
        if(wr) tr.dataset.search = (tr.dataset.search||'') + ' ' + wTxt.toLowerCase();
      }
      const cs = el('select',{onchange:async e=>{ await db.from('profiles').update({club_id:e.target.value||null}).eq('id',u.id);
          const nm = e.target.selectedOptions[0].textContent; cs.parentElement.dataset.sort = nm; setSearch(nm); }},
        [el('option',{value:'',text:'\u2014'}),...state.clubs.map(c=>el('option',{value:c.id,text:c.name}))]);
      cs.value=u.club_id||'';
      const csTd = el('td',{},[cs]); csTd.dataset.sort = u.club_id ? (clubById(u.club_id).name||'') : '';
      tr.appendChild(csTd);
      const rs = el('select',{onchange:async e=>{ await db.from('profiles').update({role:e.target.value}).eq('id',u.id); rs.parentElement.dataset.sort = e.target.value; }},
        ['player','captain','owner'].map(r=>el('option',{value:r,text:r})));
      rs.value=u.role;
      const rsTd = el('td',{},[rs]); rsTd.dataset.sort = u.role;
      tr.appendChild(rsTd);
      const pd = el('input',{type:'checkbox'}); pd.checked=u.paid;
      const pdTd = el('td',{},[pd]); pdTd.dataset.sort = u.paid ? '1' : '0';
      pd.addEventListener('change',async()=>{ await db.from('profiles').update({paid:pd.checked}).eq('id',u.id); pdTd.dataset.sort = pd.checked ? '1' : '0'; });
      tr.appendChild(pdTd);
      b2.appendChild(tr);
    });
    t2.appendChild(b2); host.appendChild(t2); sortable(t2); search.bind(b2);
  };

  Promise.all([
    db.from('interest').select('*').order('created_at',{ascending:false}),
    db.from('profiles').select('*').order('created_at')
  ]).then(([iRes,pRes])=>{
    const interest = iRes.data||[]; const all = pRes.data||[];
    const emails = new Set(all.map(u=>(u.email||'').toLowerCase()));
    const queue = interest.filter(r=>!emails.has((r.email||'').toLowerCase()));
    const wants = {};
    interest.forEach(r=>{ const e=(r.email||'').toLowerCase(); if(e && !wants[e]) wants[e]=r; });

    /* follow-up queue */
    if(iRes.error){ iWrap.appendChild(el('p',{class:'mut',text:'Could not load interest submissions.'})); }
    else if(!interest.length){ iWrap.appendChild(el('p',{class:'mut',text:'No submissions yet. They arrive from the Join form on the main site.'})); }
    else if(!queue.length){ iWrap.appendChild(el('p',{class:'mut',text:'Everyone who signed up has an account. Nothing to chase.'})); }
    else {
      const kindLabel = { player:'Single player', group:'Group', club_claim:'Claiming club' };
      iWrap.appendChild(el('div',{class:'sub',text:queue.length+' waiting on account creation \u00b7 newest first'}));
      queue.forEach(r=>{
        const card = el('div',{class:'card'});
        const club = r.club_id ? (clubById(r.club_id).name) : (r.new_club ? ('New: '+r.new_club) : 'No club preference');
        const when = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
        card.innerHTML = `<div class="h">${esc(r.name)} <span style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0">\u00b7 ${esc(kindLabel[r.kind]||r.kind)}</span></div>`;
        const line = (lbl,val)=> val ? `<div class="row"><span style="width:90px;color:var(--muted)">${lbl}</span><span style="flex:1">${esc(val)}</span></div>` : '';
        card.innerHTML += line('Email', r.email) + line('Club', club) + line('Level', r.level) + line('Players', r.players) + line('Notes', r.notes) + (when?`<div class="row"><span style="width:90px;color:var(--muted)">Received</span><span>${when}</span></div>`:'');
        const del = el('button',{class:'ghost red',text:'Delete',style:'margin-top:8px',onclick:async()=>{
          if(!confirm('Delete this submission from '+r.name+'?')) return;
          const { error } = await db.from('interest').delete().eq('id',r.id);
          if(error) return toast('Error: '+error.message);
          card.remove(); toast('Deleted.');
        }});
        card.appendChild(del);
        iWrap.appendChild(card);
      });
    }

    /* people & rostered */
    const done = u => u.club_id && (u.name||'').trim() && u.gender;
    buildPeople(pw, all.filter(u=>!done(u)), pS, 'Nobody waiting. Everyone with an account is rostered.', wants);
    buildPeople(rw, all.filter(done), rS, 'No rostered players yet. Assign clubs above and have players complete their profiles.', null);
  });

  m.appendChild(el('div',{class:'sec',text:'Results needing attention'}));
  const dis = state.results.filter(r=>r.status!=='confirmed');
  if(!dis.length) m.appendChild(el('p',{class:'mut',text:'Nothing pending or disputed.'}));
  dis.forEach(r=>{
    const f = state.fixtures.find(x=>x.id===r.fixture_id); if(!f) return;
    const row = el('div',{class:'row'});
    row.innerHTML = `<span style="flex:1">D${f.division} · N${f.night} · ${clubById(f.home_club).name} v ${clubById(f.away_club).name}</span>
      <b style="color:${r.status==='disputed'?'var(--red)':'var(--muted)'}">${r.status}</b>`;
    row.appendChild(el('button',{class:'ghost',text:'Confirm',onclick:async()=>{
      await db.from('results').update({status:'confirmed'}).eq('fixture_id',r.fixture_id);
      await loadPublic(); render(); }}));
    m.appendChild(row);
  });
}

function baseRounds(){ const seats=[0,1,2,3,4], out=[];
  for(let r=0;r<5;r++){ const p=[[5,seats[r%5]]];
    for(let k=1;k<=2;k++) p.push([seats[(r+k)%5],seats[(r-k+10)%5]]);
    out.push(p);} return out; }
async function generateSeason(){
  for(const d of [1,2,3,4]) if(state.clubs.filter(c=>c.division===d).length!==6)
    return toast('Every division needs exactly six clubs first.');
  const rows=[];
  for(const d of [1,2,3,4]){
    const slugs = state.clubs.filter(c=>c.division===d).map(c=>c.id);
    const B = baseRounds(); let round=0;
    for(let cyc=0;cyc<3;cyc++) for(const rd of B){ round++;
      const night = round<15 ? Math.ceil(round/2) : 8;
      const tue = d<=2, first = night<=4;
      const venue = (tue===first) ? 'Home Ground A' : 'Home Ground B';
      rd.forEach(([h,a],mIdx)=>{ const [H,A] = cyc===1 ? [a,h] : [h,a];
        rows.push({ division:d, round, match:mIdx+1, night, day: tue?'Tue':'Thu', venue,
          home_club:slugs[H], away_club:slugs[A] }); });
    }
  }
  const { error } = await db.from('fixtures').insert(rows);
  if(error) return toast('Error: '+error.message);
  await loadPublic(); toast('Season generated: '+rows.length+' fixtures.'); render();
}

/* ── boot ── */
(async function(){
  const mb = $('#menuBtn'), mp = $('#menuPanel');
  mb.addEventListener('click', e => { e.stopPropagation(); const o = mp.classList.toggle('open'); mb.setAttribute('aria-expanded', String(o)); });
  document.addEventListener('click', e => { if(!mp.contains(e.target) && !mb.contains(e.target)){ mp.classList.remove('open'); mb.setAttribute('aria-expanded','false'); } });
  const wanted = (location.hash || '').replace('#','');
  if (['tables','fixtures','me','club','admin'].includes(wanted)) state.tab = wanted;
  db.auth.onAuthStateChange(async (_e, session)=>{
    state.user = session ? session.user : null;
    await loadPublic(); await loadProfile();
    if (state.user && state.tab === 'in') state.tab = 'me';
    render();
  });
  const { data:{ session } } = await db.auth.getSession();
  state.user = session ? session.user : null;
  if (location.hash.indexOf('access_token=') !== -1 || location.search.indexOf('code=') !== -1) {
    history.replaceState(null, '', location.pathname);
  }
  await loadPublic(); await loadProfile(); render();
})();
</script>
